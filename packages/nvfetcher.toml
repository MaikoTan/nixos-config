# 合并的 nvfetcher 配置，管理所有 nixpkgs 上游未收录或需覆盖的包。
#
# 在仓库根目录运行：
#   nix run nixpkgs#nvfetcher -- -c packages/nvfetcher.toml
#
# 如果只想更新某个包，加 --filter：
#   nix run nixpkgs#nvfetcher -- -c packages/nvfetcher.toml --filter 'github-copilot-app'

[freedownloadmanager]
# 上游的 files2 主机只提供 latest URL，内容随发布变化，会导致已固定的
# hash 失效。改用官方 Debian 仓库 debrepo.freedownloadmanager.org 的
# 版本化路径，并从目录页自动检测最新版本，无需手动改版本号。
src.webpage = "https://debrepo.freedownloadmanager.org/pool/main/f/freedownloadmanager/"
src.regex = "freedownloadmanager_([0-9.]+)_amd64\\.deb"
fetch.url = "https://debrepo.freedownloadmanager.org/pool/main/f/freedownloadmanager/freedownloadmanager_$ver_amd64.deb"

[github-copilot-app]
# 自动追踪 github/app 的最新 release。
src.github = "github/app"
src.prefix = "v"
fetch.url = "https://github.com/github/app/releases/download/v$ver/GitHub-Copilot-linux-x64.deb"

# Magpie CLI 是闭源独立二进制；不执行官方安装脚本中的自动更新逻辑，
# 由 nvfetcher 固定版本与 hash。上游程序名为 magpie。
[magpie-cli]
src.github = "yetone/magpie-releases"
src.prefix = "v"
fetch.url = "https://github.com/yetone/magpie-releases/releases/download/v$ver/magpie-cli-linux-amd64"
# DeepSeek SH CLI。npm tarball 即完整可分发产物（预打包 CJS），
# 版本与 hash 由上游 registry 固定。npm 依赖闭包不归 nvfetcher 管，
# 见 packages/dsh/package-lock.json。
[dsh]
# registry 的 tarball 路径带 publish 版本号，从 dist-tags JSON 里取。
src.webpage = "https://registry.npmjs.org/@deepseek-ai/dsh"
src.regex = "\"latest\":\"([0-9][^\"]*)\""
fetch.url = "https://registry.npmjs.org/@deepseek-ai/dsh/-/dsh-$ver.tgz"

# Hatsune Miku 光标主题。上游是纯资源仓库（无构建系统），只需复制
# miku-cursor-linux/ 下的图标文件。tag 不带 v 前缀（1.2.6 而非 v1.2.6），
# 因此 src.prefix 留空；直接取 tag tarball。
[miku-cursors]
src.github = "supermariofps/hatsune-miku-windows-linux-cursors"
src.prefix = ""
fetch.url = "https://github.com/supermariofps/hatsune-miku-windows-linux-cursors/archive/refs/tags/$ver.tar.gz"
