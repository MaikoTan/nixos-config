name: Update Nix Flake Lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 1,15 * *" # runs at 01:00 on the 1st and 15th of every month

jobs:
  nix-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    # ubuntu-latest is migrating to Ubuntu 26 on 2026-11-19; pin 24.04 to keep
    # the image stable.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3.24.1
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: "chore(flake): update Nix flake inputs"
