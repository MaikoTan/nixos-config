name: Test NixOS Config

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    # ubuntu-latest is migrating to Ubuntu 26 on 2026-11-19; pin 24.04 so the
    # runner image stops shifting under the Nix cache (paths built on 24.04
    # would not necessarily be reused once the base image changes).
    runs-on: ubuntu-24.04

    env:
      NIXPKGS_ALLOW_UNFREE: 1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Use Cachix
        uses: cachix/cachix-action@v17
        with:
          name: maiko-nixos-build
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Check formatting
        run: |
          # treefmt's CI flag is --ci, not --check (--check belongs to
          # standalone nixfmt). --ci implies --fail-on-change and --no-cache.
          nix fmt -- --ci $(git ls-files '*.nix' | grep -v plasma-rc.nix)

      - name: Check Nix Flake
        run: |
          nix flake check

      - name: Build NixOS configuration
        run: |
          nix build .#nixosConfigurations.company.config.system.build.toplevel
